<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Worktools - Developer suite including GitLab Merge Request Description Generator" />
  <title>Worktools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hash-wasm@4.11.0/dist/argon2.umd.min.js"></script>
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-card: #1c2128;
      --bg-input: #0d1117;
      --bg-hover: #262c36;
      --border-default: #30363d;
      --border-muted: #21262d;
      --border-focus: #388bfd;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --text-accent: #fc6d26;
      --accent-gitlab: #fc6d26;
      --accent-gitlab-hover: #fd7f3f;
      --accent-green: #3fb950;
      --accent-green-dark: #238636;
      --accent-blue: #388bfd;
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
      --radius-sm: 6px;
      --radius-lg: 14px;
      --transition: 0.18s ease;
      --sidebar-width: 260px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .app-container { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-default);
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: transform var(--transition); z-index: 90;
    }
    .sidebar-header {
      padding: 20px 18px; border-bottom: 1px solid var(--border-default);
      display: flex; align-items: center; gap: 12px;
    }
    .brand-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent-blue), #1f6beb);
      border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(56, 139, 253, 0.3);
    }
    .brand-icon svg { width: 18px; height: 18px; fill: none; stroke: #fff; }
    .brand-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }
    .brand-subtitle { font-size: 0.72rem; color: var(--text-secondary); }

    .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
    .nav-section-title { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); padding: 0 10px; margin-bottom: 8px; }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .nav-item-btn {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius-sm); background: transparent;
      border: 1px solid transparent; color: var(--text-secondary);
      font-family: inherit; font-size: 0.84rem; font-weight: 500; text-align: left;
      cursor: pointer; transition: all var(--transition);
    }
    .nav-item-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-item-btn.active { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-default); font-weight: 600; }
    .nav-item-btn.active .nav-icon { color: var(--accent-gitlab); }
    .nav-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .nav-icon svg { width: 18px; height: 18px; }
    .nav-badge { margin-left: auto; font-size: 0.65rem; padding: 1px 6px; border-radius: 10px; background: rgba(252, 109, 38, 0.15); color: var(--accent-gitlab); font-weight: 600; }
    .nav-badge.soon { background: var(--bg-primary); color: var(--text-muted); }
    .sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border-default); font-size: 0.72rem; color: var(--text-muted); text-align: center; }

    /* Main Wrapper */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .header {
      background: var(--bg-secondary); border-bottom: 1px solid var(--border-default);
      padding: 16px 28px; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 80;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .mobile-toggle-btn { display: none; background: transparent; border: 1px solid var(--border-default); color: var(--text-primary); padding: 6px; border-radius: var(--radius-sm); cursor: pointer; }
    .header-title-group { display: flex; align-items: center; gap: 10px; }
    .header-icon {
      width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent-gitlab), #e24329);
      border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(252, 109, 38, 0.35);
    }
    .header-icon svg { width: 20px; height: 20px; fill: #fff; }
    .header-text h1 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
    .header-text p { font-size: 0.76rem; color: var(--text-secondary); }

    .main-content { flex: 1; padding: 24px 28px; max-width: 1400px; width: 100%; margin: 0 auto; }
    .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    .panel { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-default); }
    .panel-title { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; }
    .panel-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-muted); }
    .panel-body { padding: 20px; }

    .field-group { margin-bottom: 22px; }
    .field-label { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600; margin-bottom: 7px; }
    .field-label-icon { width: 14px; height: 14px; color: var(--text-accent); }
    .field-optional { font-size: 0.7rem; color: var(--text-muted); margin-left: 2px; }
    .field-hint { font-size: 0.72rem; color: var(--text-secondary); margin-top: 5px; }

    .input, .textarea {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border-default);
      border-radius: var(--radius-sm); color: var(--text-primary); font-family: 'Inter', sans-serif;
      font-size: 0.865rem; padding: 9px 12px; outline: none; transition: border-color var(--transition);
      resize: vertical;
    }
    .input:focus, .textarea:focus { border-color: var(--border-focus); }
    .textarea { min-height: 100px; line-height: 1.6; }

    .actions { display: flex; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-muted); }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; outline: none;
    }
    .btn-reset { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-default); flex: 1; }
    .preview-textarea {
      width: 100%; min-height: 340px; background: var(--bg-input); border: 1px solid var(--border-muted);
      border-radius: var(--radius-sm); color: var(--text-primary); font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem; line-height: 1.75; padding: 14px; resize: vertical; outline: none; white-space: pre;
    }
    .copy-btn-wrapper { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
    .btn-copy { flex: 1; background: linear-gradient(135deg, var(--accent-gitlab), #e24329); color: #fff; padding: 9px 18px; justify-content: center; }
    .btn-copy.copied { background: linear-gradient(135deg, var(--accent-green), var(--accent-green-dark)); }
    .copied-badge { font-size: 0.75rem; font-weight: 600; color: var(--accent-green); }
    .char-count { font-size: 0.7rem; color: var(--text-muted); text-align: right; margin-top: 4px; }
    .section-divider { height: 1px; background: var(--border-muted); margin: 18px 0; }

    .placeholder-tool { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; background: var(--bg-card); border: 1px dashed var(--border-default); border-radius: var(--radius-lg); text-align: center; }
    .placeholder-tool svg { width: 48px; height: 48px; color: var(--text-muted); margin-bottom: 16px; }

    @media (max-width: 900px) {
      .mobile-toggle-btn { display: flex; }
      .sidebar { position: fixed; top: 0; left: 0; bottom: 0; transform: translateX(-100%); box-shadow: var(--shadow-md); }
      .sidebar.mobile-open { transform: translateX(0); }
      .sidebar-overlay { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 85; }
      .workspace { grid-template-columns: 1fr; gap: 16px; }
      .main-content { padding: 16px 14px; }
    }

    /* Hash Generator Styles */
    .tab-group { display: flex; background: var(--bg-primary); padding: 4px; border-radius: var(--radius-md); border: 1px solid var(--border-default); margin-bottom: 20px; gap: 4px; }
    .tab-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; background: transparent; border: none; border-radius: var(--radius-sm); color: var(--text-secondary); font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all var(--transition); }
    .tab-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
    .tab-btn.active { background: var(--bg-tertiary); color: var(--text-primary); box-shadow: var(--shadow-sm); border: 1px solid var(--border-default); }
    .tab-btn svg { width: 15px; height: 15px; }

    .preset-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .preset-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 14px; background: var(--bg-primary); border: 1px solid var(--border-default); color: var(--text-secondary); font-size: 0.74rem; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all var(--transition); }
    .preset-chip:hover { border-color: var(--border-focus); color: var(--text-primary); background: var(--bg-hover); }
    .preset-chip.random-btn { font-family: 'Inter', sans-serif; font-weight: 600; background: rgba(56, 139, 253, 0.1); color: var(--accent-blue); border-color: rgba(56, 139, 253, 0.3); }
    .preset-chip.random-btn:hover { background: rgba(56, 139, 253, 0.2); border-color: var(--accent-blue); }

    .segment-control { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--bg-primary); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border-default); }
    .segment-btn { padding: 8px; text-align: center; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); background: transparent; border: none; border-radius: 4px; cursor: pointer; transition: all var(--transition); }
    .segment-btn:hover { color: var(--text-primary); }
    .segment-btn.active { background: var(--bg-card); color: var(--text-accent); border: 1px solid var(--border-default); box-shadow: var(--shadow-sm); }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .select-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-default); border-radius: var(--radius-sm); color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 0.82rem; padding: 8px 10px; outline: none; cursor: pointer; transition: border-color var(--transition); }
    .select-input:focus { border-color: var(--border-focus); }

    .hash-output-card { background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 14px; margin-bottom: 16px; position: relative; transition: border-color var(--transition); }
    .hash-output-card:hover { border-color: #3d444d; }
    .hash-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .hash-card-title { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 700; }
    .algo-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .algo-badge.bcrypt { background: rgba(56, 139, 253, 0.15); color: var(--accent-blue); border: 1px solid rgba(56, 139, 253, 0.3); }
    .algo-badge.argon { background: rgba(252, 109, 38, 0.15); color: var(--accent-gitlab); border: 1px solid rgba(252, 109, 38, 0.3); }
    .hash-code-display { background: var(--bg-card); border: 1px solid var(--border-muted); border-radius: var(--radius-sm); padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: #388bfd; word-break: break-all; line-height: 1.6; position: relative; }
    .hash-code-display.argon { color: #fc6d26; }
    .hash-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-muted); font-size: 0.7rem; color: var(--text-muted); }
    .hash-meta-chips { display: flex; gap: 8px; }
    .hash-meta-chip { background: var(--bg-tertiary); padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; color: var(--text-secondary); }
    .btn-icon-copy { display: inline-flex; align-items: center; gap: 5px; background: var(--bg-tertiary); border: 1px solid var(--border-default); color: var(--text-secondary); font-size: 0.73rem; padding: 5px 10px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; transition: all var(--transition); }
    .btn-icon-copy:hover { background: var(--bg-hover); color: var(--text-primary); border-color: #484f58; }
    .btn-icon-copy.copied { background: rgba(63, 185, 80, 0.15); color: var(--accent-green); border-color: rgba(63, 185, 80, 0.4); }
    .btn-regenerate { background: rgba(56, 139, 253, 0.1); color: var(--accent-blue); border: 1px solid rgba(56, 139, 253, 0.3); }
    .btn-regenerate:hover { background: rgba(56, 139, 253, 0.2); border-color: var(--accent-blue); }

    .inspector-card { background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 16px; margin-top: 16px; }
    .inspector-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
    .status-badge.valid { background: rgba(63, 185, 80, 0.15); color: var(--accent-green); border: 1px solid rgba(63, 185, 80, 0.3); }
    .status-badge.invalid { background: rgba(248, 81, 73, 0.15); color: var(--accent-red); border: 1px solid rgba(248, 81, 73, 0.3); }
    .inspector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
    .inspector-stat { background: var(--bg-card); padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-muted); }
    .inspector-stat-label { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 2px; text-transform: uppercase; }
    .inspector-stat-value { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); font-family: 'JetBrains Mono', monospace; }
  </style>
</head>

    const RefreshIcon = () => (

    const EditIcon = () => (

    const BCRYPT_BASE64_ALPHABET = './0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

    function toBcryptBase64(byteArray) {
      let result = '';
      let i = 0;
      const len = byteArray.length;
      while (i < len) {
        let b1 = byteArray[i++];
        let b2 = i < len ? byteArray[i++] : 0;
        let b3 = i < len ? byteArray[i++] : 0;

        let c1 = b1 >> 2;
        let c2 = ((b1 & 0x03) << 4) | (b2 >> 4);
        let c3 = ((b2 & 0x0f) << 2) | (b3 >> 6);
        let c4 = b3 & 0x3f;

        result += BCRYPT_BASE64_ALPHABET[c1];
        result += BCRYPT_BASE64_ALPHABET[c2];
        if (i - 1 < len) result += BCRYPT_BASE64_ALPHABET[c3];
        if (i < len) result += BCRYPT_BASE64_ALPHABET[c4];
      }
      return result;
    }

    function toBase64NoPadding(byteArray) {
      let binary = '';
      const bytes = new Uint8Array(byteArray);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/=/g, '');
    }

    async function generateBcryptHash(plainText, cost = 10) {
      try {
        const b = window.dcodeIO ? window.dcodeIO.bcrypt : window.bcrypt;
        if (b && b.hashSync) {
          const salt = b.genSaltSync(cost);
          const hash = b.hashSync(plainText, salt);
          return hash.replace(/^\$2[ab]\$/, '$2y$');
        }
      } catch (err) {
        console.error('Bcrypt error:', err);
      }
      return '';
    }

    async function generateArgon2idHash(plainText, memory = 1024, time = 3, parallelism = 3) {
      try {
        const hw = window.hashwasm;
        if (hw && hw.argon2id) {
          const salt = window.crypto.getRandomValues(new Uint8Array(16));
          return await hw.argon2id({
            password: plainText,
            salt,
            iterations: time,
            memorySize: memory,
            hashLength: 32,
            parallelism,
            outputType: 'encoded'
          });
        }
      } catch (err) {
        console.error('Argon2id error:', err);
      }
      return '';
    }

    async function verifyPasswordAgainstHash(plainText, hashStr) {
      if (!plainText || !hashStr) return null;
      const trimmed = hashStr.trim();
      try {
        if (trimmed.startsWith('$2')) {
          const b = window.dcodeIO ? window.dcodeIO.bcrypt : window.bcrypt;
          if (b && b.compareSync) {
            const normalized = trimmed.replace(/^\$2[yb]\$/, '$2a$');
            return b.compareSync(plainText, normalized);
          }
        }
        if (trimmed.startsWith('$argon2id$')) {
          const hw = window.hashwasm;
          if (hw && hw.argon2Verify) {
            return await hw.argon2Verify({ password: plainText, hash: trimmed });
          }
        }
      } catch (err) {
        console.error('Verify error:', err);
        return false;
      }
      return false;
    }

    function analyzeHashString(hashStr) {
      if (!hashStr || typeof hashStr !== 'string') {
        return { valid: false, message: 'Empty input' };
      }
      const trimmed = hashStr.trim();
      
      const bcryptMatch = trimmed.match(/^\$(2[ayb])\$(\d{2})\$([.\/A-Za-z0-9]{22})([.\/A-Za-z0-9]{31})$/);
      if (bcryptMatch) {
        return {
          valid: true,
          type: 'Bcrypt (Hash Biasa)',
          variant: `$${bcryptMatch[1]}$ (Laravel Standard)`,
          cost: parseInt(bcryptMatch[2], 10),
          salt: bcryptMatch[3],
          cipher: bcryptMatch[4],
          length: trimmed.length,
        };
      }

      const argonMatch = trimmed.match(/^\$argon2id\$v=(\d+)\$m=(\d+),t=(\d+),p=(\d+)\$([A-Za-z0-9+/=]+)\$([A-Za-z0-9+/=]+)$/);
      if (argonMatch) {
        return {
          valid: true,
          type: 'Argon2id (Hash Argon)',
          version: argonMatch[1],
          memory: `${argonMatch[2]} KiB`,
          time: argonMatch[3],
          parallelism: argonMatch[4],
          salt: argonMatch[5],
          cipher: argonMatch[6],
          length: trimmed.length,
        };
      }

      return {
        valid: false,
        message: 'Format not recognized as standard Laravel Bcrypt ($2y$) or Argon2id ($argon2id$).',
      };
    }

    function generateMarkdown({ threadLink, deploymentSteps, tablesToBackup }) {

        if (!trimmed) return `* ${defaultText}`;
        const lines = trimmed.split('\n').filter(l => l.trim());
        return lines.map(l => `* ${l.trim()}`).join('\n');

      const threadLinkValue = threadLink.trim() ? `* ${threadLink.trim()}` : `* ${DEFAULTS.threadLink}`;

        '',
        'Deployment Steps',

        'Tables Need To Backup',
        '',
        formatBullets(tablesToBackup, DEFAULTS.tablesToBackup),

                          {inspectInfo.memory && <div className="inspector-stat"><div className="inspector-stat-label">Memory</div><div className="inspector-stat-value">{inspectInfo.memory}</div></div>}
                          {inspectInfo.time && <div className="inspector-stat"><div className="inspector-stat-label">Time (t)</div><div className="inspector-stat-value">{inspectInfo.time}</div></div>}
                          {inspectInfo.parallelism && <div className="inspector-stat"><div className="inspector-stat-label">Threads (p)</div><div className="inspector-stat-value">{inspectInfo.parallelism}</div></div>}
                          <div className="inspector-stat"><div className="inspector-stat-label">Length</div><div className="inspector-stat-value">{inspectInfo.length} chars</div></div>
                        </div>
                      </div>
                    ) : (
                      <p style={{ fontSize: '0.8rem', color: 'var(--accent-red)' }}>{inspectInfo.message}</p>
                    )}
                  </div>

                  {/* Password Verifier Section */}
                  <div style={{ marginTop: '16px', padding: '14px', background: 'var(--bg-card)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-default)' }}>
                    <label className="field-label" htmlFor="testPasswordInput" style={{ marginBottom: '6px' }}>
                      <span className="field-label-icon"><KeyIcon /></span>
                      Test Plaintext Password Against this Hash
                    </label>
                    <input
                      id="testPasswordInput"
                      type="text"
                      className="input"
                      placeholder="Type plaintext password to verify (e.g. password)..."
                      value={inspectTestPassword}
                      onChange={(e) => setInspectTestPassword(e.target.value)}
                      spellCheck="false"
                    />

                    <div style={{ marginTop: '10px' }}>
                      {!inspectHash ? (
                        <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                          Paste a hash above to begin verification.
                        </span>
                      ) : !inspectTestPassword ? (
                        <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                          Enter a password to test matching.
                        </span>
                      ) : isVerifying ? (
                        <span className="status-badge" style={{ background: 'rgba(56, 139, 253, 0.15)', color: 'var(--accent-blue)', borderColor: 'rgba(56, 139, 253, 0.3)' }}>
                          Verifying cryptographic match...
                        </span>
                      ) : inspectMatchResult === true ? (
                        <div style={{ padding: '10px 12px', borderRadius: 'var(--radius-sm)', background: 'rgba(63, 185, 80, 0.15)', border: '1px solid rgba(63, 185, 80, 0.4)', color: '#56d364', fontSize: '0.82rem', display: 'flex', alignItems: 'flex-start', gap: '8px' }}>
                          <CheckIcon />
                          <div>
                            <strong>MATCH! (Valid untuk Login)</strong>
                            <div style={{ fontSize: '0.74rem', opacity: 0.9, marginTop: '2px' }}>
                              Password &ldquo;{inspectTestPassword}&rdquo; cocok dengan hash ini. Laravel <code>Hash::check()</code> / <code>Auth::attempt()</code> akan berhasil.
                            </div>
                          </div>
                        </div>
                      ) : (
                        <div style={{ padding: '10px 12px', borderRadius: 'var(--radius-sm)', background: 'rgba(248, 81, 73, 0.15)', border: '1px solid rgba(248, 81, 73, 0.4)', color: '#f85149', fontSize: '0.82rem', display: 'flex', alignItems: 'flex-start', gap: '8px' }}>
                          <span style={{ fontWeight: 'bold', fontSize: '1rem', lineHeight: '1' }}>✕</span>
                          <div>
                            <strong>MISMATCH (Login akan Gagal)</strong>
                            <div style={{ fontSize: '0.74rem', opacity: 0.9, marginTop: '2px' }}>
                              Password &ldquo;{inspectTestPassword}&rdquo; TIDAK cocok dengan hash ini. Jika disimpan di database, login user akan ditolak.
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </section>

          <section className="panel">
            <div className="panel-header">
              <span className="panel-title"><EyeIcon />Generated Hash Output</span>
              <span className="panel-badge">Real-time</span>
            </div>
            <div className="panel-body">
              {(hashType === 'bcrypt' || hashType === 'both') && (
                <div className="hash-output-card">
                  <div className="hash-card-header">
                    <span className="hash-card-title"><LockIcon />Hash Biasa (Bcrypt)</span>
                    <span className="algo-badge bcrypt">$2y$10$</span>
                  </div>
                  <div className="hash-code-display">{bcryptHash}</div>
                  <div className="hash-card-footer">
                    <div className="hash-meta-chips">
                      <span className="hash-meta-chip">60 chars</span>
                      <span className="hash-meta-chip">Cost: {cost}</span>
                      <span className="hash-meta-chip">Laravel Default</span>
                    </div>
                    <button type="button" className={`btn-icon-copy ${copiedBcrypt ? 'copied' : ''}`} onClick={() => copyToClipboard(bcryptHash, setCopiedBcrypt)}>
                      {copiedBcrypt ? <CheckIcon /> : <CopyIcon />} {copiedBcrypt ? 'Copied' : 'Copy'}
                    </button>
                  </div>
                </div>
              )}

              {(hashType === 'argon' || hashType === 'both') && (
                <div className="hash-output-card">
                  <div className="hash-card-header">
                    <span className="hash-card-title"><KeyIcon />Hash Argon (Argon2id)</span>
                    <span className="algo-badge argon">$argon2id$</span>
                  </div>
                  <div className="hash-code-display argon">{argonHash}</div>
                  <div className="hash-card-footer">
                    <div className="hash-meta-chips">
                      <span className="hash-meta-chip">Argon2id v19</span>
                      <span className="hash-meta-chip">m={argonMemory}, t={argonTime}, p={argonThreads}</span>
                    </div>
                    <button type="button" className={`btn-icon-copy ${copiedArgon ? 'copied' : ''}`} onClick={() => copyToClipboard(argonHash, setCopiedArgon)}>
                      {copiedArgon ? <CheckIcon /> : <CopyIcon />} {copiedArgon ? 'Copied' : 'Copy'}
                    </button>
                  </div>
                </div>
              )}

              <div className="field-group" style={{ marginTop: '20px' }}>
                <label className="field-label"><span className="field-label-icon"><CodeIcon /></span>Formatted Output ({outputFormat})</label>
                <textarea className="preview-textarea" readOnly value={snippet} style={{ minHeight: '160px' }} />
                <p className="char-count">{snippet.length} characters</p>
              </div>

              <div className="copy-btn-wrapper">
                <button type="button" className={`btn btn-copy ${copiedCode ? 'copied' : ''}`} onClick={() => copyToClipboard(snippet, setCopiedCode)}>
                  {copiedCode ? <CheckIcon /> : <CopyIcon />} {copiedCode ? 'Copied Snippet!' : 'Copy Code Snippet'}
                </button>
              </div>
            </div>
          </section>
        </div>
      );
    }

    function App() {
      const [activeTool, setActiveTool] = useState('gitlab-mr');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [form, setForm] = useState(INITIAL_STATE);
      const [copied, setCopied] = useState(false);

      const markdown = generateMarkdown(form);

      const handleChange = useCallback((field) => (e) => {
        setForm(prev => ({ ...prev, [field]: e.target.value }));
      }, []);

      const handleReset = useCallback(() => {
        setForm(INITIAL_STATE);
        setCopied(false);
      }, []);

      const handleCopy = useCallback(async () => {
        try {
          await navigator.clipboard.writeText(markdown);
        } catch {
          const el = document.createElement('textarea');
          el.value = markdown;
          el.style.position = 'fixed';
          el.style.opacity = '0';
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
        }
        setCopied(true);
        setTimeout(() => setCopied(false), 2200);
      }, [markdown]);

      return (
        <div className="app-container">
          {sidebarOpen && <div className="sidebar-overlay" onClick={() => setSidebarOpen(false)} />}

          <aside className={`sidebar ${sidebarOpen ? 'mobile-open' : ''}`}>
            <div className="sidebar-header">
              <div className="brand-icon"><WorktoolsIcon /></div>
              <div>
                <h2 className="brand-title">Worktools</h2>
                <p className="brand-subtitle">Developer Utilities</p>
              </div>
            </div>
            <nav className="sidebar-nav">
              <div className="nav-section-title">Git & Code Tools</div>
              <ul className="nav-list">
                <li>
                  <button
                    type="button"
                    className={`nav-item-btn ${activeTool === 'gitlab-mr' ? 'active' : ''}`}
                    onClick={() => { setActiveTool('gitlab-mr'); setSidebarOpen(false); }}
                  >
                    <span className="nav-icon"><GitLabIcon /></span>
                    GitLab MR Generator
                    <span className="nav-badge">Active</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    className={`nav-item-btn ${activeTool === 'hash-gen' ? 'active' : ''}`}
                    onClick={() => { setActiveTool('hash-gen'); setSidebarOpen(false); }}
                  >
                    <span className="nav-icon"><HashIcon /></span>
                    Hash:: Generator
                    <span className="nav-badge" style={{ background: 'rgba(56, 139, 253, 0.15)', color: 'var(--accent-blue)' }}>New</span>
                  </button>
                </li>
              </ul>
            </nav>
            <div className="sidebar-footer">GG AI &copy; {new Date().getFullYear()}</div>
          </aside>

          <div className="main-wrapper">
            <header className="header">
              <div className="header-left">
                <button type="button" className="mobile-toggle-btn" onClick={() => setSidebarOpen(!sidebarOpen)}>
                  <MenuIcon />
                </button>
                <div className="header-title-group">
                  <div
                    className="header-icon"
                    style={
                      activeTool === 'hash-gen'
                        ? { background: 'linear-gradient(135deg, #388bfd, #1f6beb)', boxShadow: '0 2px 8px rgba(56, 139, 253, 0.35)' }
                        : {}
                    }
                  >
                    {activeTool === 'hash-gen' ? <HashIcon /> : <GitLabIcon />}
                  </div>
                  <div className="header-text">
                    <h1>
                      {activeTool === 'hash-gen'
                        ? 'Hash:: Generator'
                        : 'MR Description Generator'}
                    </h1>
                    <p>
                      {activeTool === 'hash-gen'
                        ? 'Generate Laravel Hash::make() compatible Bcrypt ($2y$) and Argon2id ($argon2id$) password hashes'
                        : 'Generate GitLab Merge Request descriptions instantly'}
                    </p>
                  </div>
                </div>
              </div>
            </header>

            <main className="main-content">
              {activeTool === 'gitlab-mr' ? (
                <div className="workspace">
                  <section className="panel">
                    <div className="panel-header">
                      <span className="panel-title"><EditIcon />Input Fields</span>
                      <span className="panel-badge">All optional</span>
                    </div>
                    <div className="panel-body">
                      <div className="field-group">
                        <label className="field-label" htmlFor="threadLink">
                          <span className="field-label-icon"><LinkIcon /></span>
                          Nyra Thread Link
                          <span className="field-optional">optional</span>
                        </label>
                        <input
                          id="threadLink" type="text" className="input"
                          placeholder="https://..."
                          value={form.threadLink} onChange={handleChange('threadLink')}
                        />
                        <p className="field-hint">Paste the Nyra thread URL related to this MR.</p>
                      </div>

                      <div className="section-divider" />

                      <div className="field-group">
                        <label className="field-label" htmlFor="deploymentSteps">
                          <span className="field-label-icon"><StepsIcon /></span>
                          Deployment Steps
                          <span className="field-optional">optional</span>
                        </label>
                        <textarea
                          id="deploymentSteps" className="textarea"
                          placeholder={`Run migration\nUpdate .env config\nRestart queue workers`}
                          value={form.deploymentSteps} onChange={handleChange('deploymentSteps')} rows={5}
                        />
                        <p className="field-hint">Each line will be converted into a separate bullet point.</p>
                      </div>

                      <div className="section-divider" />

                      <div className="field-group">
                        <label className="field-label" htmlFor="tablesToBackup">
                          <span className="field-label-icon"><TableIcon /></span>
                          Tables Need To Backup
                          <span className="field-optional">optional</span>
                        </label>
                        <textarea
                          id="tablesToBackup" className="textarea"
                          placeholder={`users\norders\norder_items`}
                          value={form.tablesToBackup} onChange={handleChange('tablesToBackup')} rows={4}
                        />
                        <p className="field-hint">List database tables that need to be backed up before deployment.</p>
                      </div>

                      <div className="actions">
                        <button type="button" className="btn btn-reset" onClick={handleReset}>
                          <ResetIcon /> Reset
                        </button>
                      </div>
                    </div>
                  </section>

                  <section className="panel">
                    <div className="panel-header">
                      <span className="panel-title"><EyeIcon />Markdown Preview</span>
                      <span className="panel-badge">Live</span>
                    </div>
                    <div className="panel-body">
                      <textarea className="preview-textarea" readOnly value={markdown} />
                      <p className="char-count">{markdown.length} characters</p>
                      <div className="copy-btn-wrapper">
                        <button type="button" className={`btn btn-copy${copied ? ' copied' : ''}`} onClick={handleCopy}>
                          {copied ? <CheckIcon /> : <CopyIcon />} {copied ? 'Copied!' : 'Copy to Clipboard'}
                        </button>
                        {copied && <span className="copied-badge"><CheckIcon /> Copied to clipboard</span>}
                      </div>
                    </div>
                  </section>
                </div>
              ) : (
                <HashGeneratorTool />
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
